name: Generate CycloneDX BOMs
on:
  schedule:
    - cron: "0 0 * * 5"
  repository_dispatch:
    types:
      - run-sbom-scan
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-sbom:
    runs-on:
      - self-hosted
      - dependency-track
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install OpenGrep
        run: |
          if [ -x "$HOME/.opengrep/cli/latest/opengrep" ]; then
            echo "opengrep already installed, skipping"
          else
            curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/v1.25.0/install.sh | bash -s -- -v 1.25.0
          fi
          echo "$HOME/.opengrep/cli/latest" >> $GITHUB_PATH

      - name: Install CryptoFinder
        run: |
          if [ -x "$HOME/go/bin/crypto-finder" ]; then
            echo "crypto-finder already installed, skipping"
          else
            go install github.com/scanoss/crypto-finder/cmd/crypto-finder@latest
          fi
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Setup Python Virtual Environment
        run: |
          if [ -d ".venv" ]; then
            echo "venv already exists, skipping creation"
          else
            python3 -m venv .venv
          fi
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install scanoss
          pip install anthropic
          pip install markdown
          pip install jinja2
          pip install weasyprint

      - name: Verify Installation
        run: |
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
          source .venv/bin/activate
          which opengrep
          opengrep --version
          which crypto-finder
          crypto-finder version
          which scanoss-py
          scanoss-py --help

      - name: Create Reports Directory
        run: |
          mkdir -p reports/SBOM
          mkdir -p reports/CBOM

      - name: Generate SBOM and CBOM
        env:
          SCANOSS_API_KEY: ${{ secrets.SCANOSS_API_KEY }}
          DTRACK_URL: ${{ secrets.DTRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          DTRACK_PROJECT_UUID: ${{ secrets.DTRACK_PROJECT_UUID }}
        run: |
          source .venv/bin/activate
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
          TODAY=$(date +%F)
          REPOS=(
            "https://github.com/premchandoffice/integration-github-actions.git"
            "https://github.com/openssl/openssl.git"
          )
          for REPO in "${REPOS[@]}"
          do
            NAME=$(basename "$REPO" .git)
            echo "=================================="
            echo "Scanning: $NAME"
            echo "=================================="
            git clone --depth 1 "$REPO" "$NAME"
            scanoss-py scan \
              "$NAME" \
              --format cyclonedx \
              --output "reports/SBOM/${TODAY}_${NAME}.cdx.json"
          echo "Uploading SBOM to Dependency-Track..."

          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${DTRACK_URL}/api/v1/bom" \
            -H "X-Api-Key: ${DTRACK_API_KEY}" \
            -F "project=${DTRACK_PROJECT_UUID}" \
            -F "bom=@reports/SBOM/${TODAY}_${NAME}.cdx.json")

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "✅ SBOM uploaded successfully for ${NAME}"
          else
              echo "❌ Upload failed for ${NAME}"
              echo "HTTP Status: ${HTTP_CODE}"
              cat response.json
              exit 1
          fi
            crypto-finder scan \
              --api-key "$SCANOSS_API_KEY" \
              --format cyclonedx \
              --output "reports/CBOM/${TODAY}_${NAME}.cbom.json" \
              "$NAME"
              
            python scripts/report_generator.py \
              --sbom "reports/SBOM/${TODAY}_${NAME}.cdx.json" \
              --cbom "reports/CBOM/${TODAY}_${NAME}.cbom.json" \
              --repo "$NAME"
              
            rm -rf "$NAME"
          done

      - name: Commit Reports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add CycloneDX reports"
            git push
          fi

      - name: Sync dashboard
        run: |
          cd /home/lyraadmin/lyra_app
          docker compose exec -T web python scripts/sync_weeklyscan.py
