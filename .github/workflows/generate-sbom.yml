name: Generate CycloneDX BOMs
on:
  schedule:
    - cron: "0 0 * * 5"
  repository_dispatch:
    types:
      - run-sbom-scan
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-sbom:
    runs-on:
      - self-hosted
      - dependency-track
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install OpenGrep
        run: |
          if [ -x "$HOME/.opengrep/cli/latest/opengrep" ]; then
            echo "opengrep already installed, skipping"
          else
            curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/v1.25.0/install.sh | bash -s -- -v 1.25.0
          fi
          echo "$HOME/.opengrep/cli/latest" >> $GITHUB_PATH

      - name: Install CryptoFinder
        run: |
          if [ -x "$HOME/go/bin/crypto-finder" ]; then
            echo "crypto-finder already installed, skipping"
          else
            go install github.com/scanoss/crypto-finder/cmd/crypto-finder@latest
          fi
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Setup Python Virtual Environment
        run: |
          if [ ! -d ".venv" ]; then
            python3 -m venv .venv
          fi
      
          source .venv/bin/activate
      
          python -m pip install --upgrade pip
      
          pip install \
            scanoss \
            anthropic \
            markdown \
            jinja2 \
            weasyprint

      - name: Verify Installation
        run: |
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
          source .venv/bin/activate
          which opengrep
          opengrep --version
          which crypto-finder
          crypto-finder version
          which scanoss-py
          scanoss-py --help

      - name: Create Reports Directory
        run: |
          mkdir -p reports/SBOM
          mkdir -p reports/CBOM

      - name: Generate Reports
        env:
          SCANOSS_API_KEY: ${{ secrets.SCANOSS_API_KEY }}
          DTRACK_URL: ${{ secrets.DTRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          DTRACK_PROJECT_UUID: ${{ secrets.DTRACK_PROJECT_UUID }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          set -euo pipefail
      
          source .venv/bin/activate
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
      
          TODAY=$(date +%F)
      
          mkdir -p reports/SBOM
          mkdir -p reports/CBOM
          mkdir -p reports/HTML
          mkdir -p reports/PDF
      
          REPOS=(
            "https://github.com/premchandoffice/integration-github-actions.git"
            "https://github.com/openssl/openssl.git"
          )
      
          for REPO in "${REPOS[@]}"
          do
            NAME=$(basename "$REPO" .git)
      
            echo "=================================="
            echo "Scanning $NAME"
            echo "=================================="
      
            rm -rf "$NAME"
      
            git clone --depth 1 "$REPO" "$NAME"
      
            #################################################
            # Generate SBOM
            #################################################
      
            scanoss-py scan \
              "$NAME" \
              --format cyclonedx \
              --output "reports/SBOM/${TODAY}_${NAME}.cdx.json"
      
            test -f "reports/SBOM/${TODAY}_${NAME}.cdx.json"
      
            #################################################
            # Upload SBOM to Dependency-Track
            #################################################
      
            curl -fsS \
              -X POST "${DTRACK_URL}/api/v1/bom" \
              -H "X-Api-Key: ${DTRACK_API_KEY}" \
              -F "project=${DTRACK_PROJECT_UUID}" \
              -F "bom=@reports/SBOM/${TODAY}_${NAME}.cdx.json"
      
            #################################################
            # Generate CBOM
            #################################################
      
            crypto-finder scan \
              --api-key "$SCANOSS_API_KEY" \
              --format cyclonedx \
              --output "reports/CBOM/${TODAY}_${NAME}.cbom.json" \
              "$NAME"
      
            test -f "reports/CBOM/${TODAY}_${NAME}.cbom.json"
      
            #################################################
            # Generate AI Reports
            #################################################
      
            python scripts/report_generator.py \
              --sbom "reports/SBOM/${TODAY}_${NAME}.cdx.json" \
              --cbom "reports/CBOM/${TODAY}_${NAME}.cbom.json" \
              --repo "$NAME"
      
            #################################################
            # Cleanup
            #################################################
      
            rm -rf "$NAME"
      
          done

      - name: Upload Reports as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-audit-reports
          path: reports
          retention-days: 90
    
      - name: Commit Reports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add CycloneDX reports"
            git push
          fi

      - name: Sync dashboard
        run: |
          cd /home/lyraadmin/lyra_app
          docker compose exec -T web python scripts/sync_weeklyscan.py
